<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles/global.css">
  <script src="scripts/index.js" defer></script>
  <title>Formulário JS</title>
</head>

<body>
  <header>
    <h1>Formulário de Cadastro de Professor d Música</h1>
  </header>
  <main>
    <h2>Cadastro</h2>
    <form id="cadastro" novalidate onsubmit="executar(event)">
      <label for="nome">Nome*</label>
      <input type="text" id="nome" name="nome">
      <p id="erro-nome" class="oculto"></p>

      <label for="idade">Idade*</label>
      <input type="number" id="idade" name="idade">
      <p id="erro-idade" class="oculto"></p>

      <label for="Celular">Celular*</label>
      <input type="text" id="celular" name="celular" oninput="mascararCelular(event)">
      <p class="small-note">Insira apenas os números.</p>
      <p id="erro-celular" class="oculto"></p>


      <label for="email">Email*</label>
      <input type="email" id="email" name="email">
      <p id="erro-email" class="oculto"></p>

      <label for="especialidade">Especialidade</label>
      <select id="especialidade" name="especialidade">
        <option value=" 0">Não informada</option>
        <option value="1">Técnica Vocal</option>
        <option value="2">Piano</option>
        <option value="3">Violino</option>
        <option value="4">Viola</option>
        <option value="5">Cello</option>
        <option value="6">Violão Erudito</option>
        <option value="7">Baixo Acústico</option>
      </select>

      <label for="escolaridade">Escolaridade</label>
      <input type="text" id="escolaridade" name="escolaridade" placeholder="Superior completo">

      <label for="certificacao">Certificação</label>
      <input type="text" id="certificacao" name="certificacao" placeholder="RCM Level 12">

      <label for="publico-alvo">Público Alvo</label>
      <select id="publico-alvo" name="publico-alvo">
        <option value="0">Não especificado</option>
        <option value="1">Iniciante</option>
        <option value="2">Intermediário</option>
        <option value="3">Avançado</option>
      </select>

      <label for="local">Local da Aula</label>
      <select id="local" name="local">
        <option value="0">Não especificado</option>
        <option value="1">Escola</option>
        <option value="2">Casa do Aluno</option>
        <option value="3">Videoconferência</option>
      </select>

      <label for="experiencia">Tempo de Experiência como Instrutor (em anos)</label>
      <input type="text" id="experiencia" name="experiencia" placeholder="2">
      <p class="small-note">Insira "0" caso não tenha experiência</p>

      <label>
        <input type="checkbox" id="termos">
        Li e aceito os termos
        <p id="erro-termos" class="oculto"></p>
      </label>

      <button type="submit">Enviar</button>
      <p id="concluido" class="oculto"></p>

    </form>
  </main>
  <footer>
    <p>Projeto para conhecermos o JavaScript</p>
  </footer>
</body>

</html>
